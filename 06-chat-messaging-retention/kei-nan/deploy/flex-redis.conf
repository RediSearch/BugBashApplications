# Flex / BigRedis (disk-index-capable) server config for the REAL disk run.
#
# A plain OSS redis-server CANNOT run on-disk search — it rejects every
# bigredis-* directive below. You need a Flex/BigRedis-capable build (the same
# server the RediSearch disk flow-tests use; see
# RediSearchDisk/flow-tests/conftest.py::_build_bigredis_config).
#
# Start with:  redis-server /path/to/flex-redis.conf
# Verify the disk path is live:  redis-cli INFO search | grep search_disk_usage
# (that field only appears when the index is disk-backed).

port 6379
dir ./flexdata

# --- enable the on-disk (SpeedB) storage tier ---
bigredis-enabled yes
bigredis-driver speedb
bigredis-path ./flexdata/redis.big
bigredis-use-async yes

# RAM budget: keep this WELL BELOW your dataset size so keys spill to disk.
# maxmemory is the hard cap; bigredis-max-ram is the RAM tier for BigRedis.
maxmemory 4gb
bigredis-max-ram 1gb
# Optional: cap RAM residency by key COUNT instead of size, to force spill even
# with small values (e.g. "50%"). Leave unset to use the size-based budget.
# bigredis-max-ram-keys 50%
bigredis-memtable-budget-db 50
bigredis-memtable-budget-ram 200

# --- module + debug commands (harness uses _FT.DEBUG DISK_FLUSH / GC_FORCEINVOKE
#     and DEBUG RELOAD; all optional — the harness degrades gracefully) ---
enable-debug-command yes
enable-module-command yes
loglevel notice

# Point this at your disk-index-capable redisearch.so build.
loadmodule /path/to/redisearch.so
